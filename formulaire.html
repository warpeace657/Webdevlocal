<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="form">
        <div class="form-container">
            <!-- Formulaire de démonstration gratuite -->
            <form action="https://formspree.io/f/mzerzvkk" method="POST" data-netlify="true">

                <div class="form-group">
                    <label for="bizname">Nom de l'entreprise</label>
                    <input type="text" id="bizname" name="business_name" placeholder="ex. : Plomberie Saint-Jérôme"
                        required>
                </div>

                <div class="form-group">
                    <label for="contactname">Votre nom</label>
                    <input type="text" id="contactname" name="client_name" placeholder="ex. : Marc Tremblay" required>
                </div>

                <div class="form-group">
                    <label for="projectdescription">Une brève description de ce que vous recherchez pour votre
                        site</label>
                    <input type="freetext" id="projectdescription" name="description"
                        placeholder=" Veuillez entrer une courte description de votre site désiré" required>
                </div>

                <div class="form-group">
                    <label for="anciensite">Veuillez fournir le lien de votre ancien site, si il y a lieu</label>
                    <input type="freetext" id="anciensite" name="anciensite" placeholder=" www.example.com " optional>
                </div>

                <div class="form-group">
                    <label for="email">Adresse courriel</label>
                    <input type="email" id="email" name="email" placeholder="nom@entreprise.ca" required>
                </div>

                <div id="upload-container">
                    <input type="hidden" id="uploaded-file-key" name="r2_file_key" />
                </div>

                <button type="submit" class="formsubmit">Envoyer</button>

            </form>
        </div>
    </div>


</body>

</html>
